<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="header-content">
          <div>
            <h1>QuickNotes</h1>
            <p>Capture ideas, reminders, and plans in one simple place.</p>
          </div>
          <button id="theme-toggle" type="button">Dark mode</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="panel" aria-labelledby="add-note-heading">
        <h2 id="add-note-heading">Add a note</h2>
        <form id="note-form">
          <div class="form-field">
            <label for="note-input">Note</label>
            <input
              id="note-input"
              name="note"
              type="text"
              autocomplete="off"
              placeholder="What needs remembering?"
            />
          </div>
          <div class="form-field">
            <label for="note-category">Category</label>
            <select id="note-category" name="category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
            </select>
          </div>
          <button type="submit">Add Note</button>
        </form>
        <p id="error-message" role="alert"></p>
      </section>

      <section class="panel" aria-labelledby="your-notes-heading">
        <div class="notes-heading">
          <h2 id="your-notes-heading">Your notes</h2>
          <label for="search-input">Search</label>
          <input id="search-input" type="search" placeholder="Search notes..." />
        </div>
        <p id="note-count">You have no notes yet.</p>
        <button id="clear-all" type="button">Clear all</button>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 QuickNotes</p>
    </footer>
  </body>
</html>
